lyrics: |
  Venite mortalium accaelitum turbae\\
  misericordiae Matrem Mariam,\\
  precibus flectite Reginam Virginem\\
  colite Maria audiet.\\[1ex]
  O Maria,\\
  nos damus gloriam,\\
  da nobis gratiam\\
  instantes conspicis,\\
  fac dignos coelicis\\
  nos tuis muneribus,\\
  tua ope tua prece\\
  nos mundum spernere\\
  et coelum quaerere\\
  semper adjuva.\\
  Maria Mater misericordiae\\[1ex]
  doce nos vincere\\
  animae hostes ac spernere,\\
  in tuis meritis nostra sit spes,\\
  tuo auxilio nostra stat res.\\[1ex]
  [S tutti]\\
  Vos ergo miseri\\
  ad vestram hanc Reginam\\
  ad Matrem ac Mariam.\\
  Corde puro accurite,\\
  gratias poscite,\\
  precibus refundite.\\[1ex]
  [A, T, B tutti]\\
  Nunc canamus pariter\\
  aeque ac dulciter\\
  et pie veneremur hunc Sanctum [or: hanc Sanctam].\\
  Cuius sanctimoniam\\
  stupentibus oculis\\
  cernite et colite.
