toe: |
  –  & –  & –   & In \B1, punctuated rhythms involving a
                  \sixteenthNoteDotted\ typically comprise \thirtysecondNote,
                  i.e., 16.–32–32. Here, these rhythms are
                  reproduced as 16.–64–64. \\
  –  & –  & trb & In \B1, trb 1/2 are only explicitly indicated as
                  solo instruments in bars 11–30 of \textit{Averte faciem}.
                  Here, they also play colla parte with A and T, respectively,
                  in tutti sections. \\
  8  & 27 & B 2 & 3rd to 5th \eighthNote\ in \B1: \sharp f4. \\
  13 & 18 & trb 2, T & last \eighthNote\ in \B1: a16–g16 \\
